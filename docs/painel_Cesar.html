<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM LatAm — Control Tower</title>
<style>
  :root{
    --bg:#0c1220;--panel:#131c2e;--panel2:#182338;--line:#24314c;
    --tx:#dbe4f2;--tx2:#8fa0bc;--tx3:#5f6f8d;
    --red:#ff5c6c;--amber:#ffb454;--green:#3ddc97;--blue:#4da3ff;--purple:#b48cff;--gray:#7a8699;
    --shadow:rgba(0,0,0,.5);
  }
  body.light{
    --bg:#eef1f7;--panel:#ffffff;--panel2:#f4f7fc;--line:#d8e0ea;
    --tx:#17212f;--tx2:#516079;--tx3:#8291a7;
    --red:#d63a49;--amber:#c47d16;--green:#12915f;--blue:#2f6fd0;--purple:#7a5fc0;--gray:#7a8699;
    --shadow:rgba(30,45,70,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;min-height:100vh;transition:background .2s,color .2s}
  .top{display:flex;align-items:center;gap:16px;padding:14px 26px;background:linear-gradient(90deg,#101a2c,#0d1526);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#2f6fd0,#4da3ff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
  .logo h1{font-size:16px;font-weight:700;letter-spacing:.6px;color:#fff}.logo h1 span{color:#4da3ff}
  .logo small{display:block;color:#8fa3c2;font-size:11px}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .top .meta{text-align:right;font-size:11px;color:#8fa3c2}.top .meta b{color:#dbe4f2}
  .themebtn{cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#dbe4f2;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}
  .aobar{display:inline-flex;align-items:center;gap:8px}
  .aowho{font-size:12px;color:#9fe6bd;font-weight:700;white-space:nowrap}
  .lbl{display:block;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin:4px 0 4px}
  .themebtn:hover{background:rgba(255,255,255,.16)}
  .modeflag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.5px;margin-left:8px}
  .flag-admin{background:rgba(180,140,255,.22);color:#c3a8f7;border:1px solid rgba(180,140,255,.4)}
  .flag-view{background:rgba(77,163,255,.2);color:#79b0f5;border:1px solid rgba(77,163,255,.4)}
  .wrap{max-width:1400px;margin:0 auto;padding:20px 26px 80px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
  .kpi.clik{cursor:pointer;transition:border-color .12s,transform .12s,box-shadow .12s}
  .kpi.clik:hover{border-color:var(--c,var(--blue));transform:translateY(-2px)}
  .kpi.on{border-color:var(--c,var(--blue));box-shadow:inset 0 0 0 1px var(--c,var(--blue))}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--blue))}
  .kpi .v{font-size:30px;font-weight:800;color:var(--c,var(--blue));line-height:1.1}
  .kpi .l{font-size:10.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .tab{padding:9px 20px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--tx2);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
  .tab:hover{color:var(--tx);border-color:#33436a}
  .tab.on{background:linear-gradient(135deg,#2f6fd0,#3b82e0);color:#fff;border-color:transparent}
  .tab .b{display:inline-block;min-width:20px;padding:1px 6px;border-radius:99px;background:rgba(128,128,128,.22);font-size:11px;margin-left:6px}
  .tab .pend{background:var(--amber);color:#101a2c}
  .btn{padding:9px 18px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);cursor:pointer;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--blue)}
  .btn.primary{background:linear-gradient(135deg,#2f6fd0,#3b82e0);border-color:transparent;color:#fff}
  .btn.green{background:linear-gradient(135deg,#1e9e6a,#2bbd80);border-color:transparent;color:#fff}
  .btn.ghost{background:transparent}.btn.sm{padding:5px 12px;font-size:12px}
  .btn.big{padding:11px 22px;font-size:14px}
  .btn.danger{color:#fff;background:linear-gradient(135deg,#c53442,#ff5c6c);border-color:transparent}
  .btn.dangerghost{color:var(--red);border-color:rgba(214,58,73,.5);background:transparent}
  .actbar{margin-left:auto;display:flex;gap:8px;align-items:center}
  .savehint{font-size:11px;color:var(--amber);font-weight:600}
  .toggle{cursor:pointer;font-size:12px;color:var(--tx2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600}
  .toggle.on{color:var(--amber);border-color:var(--amber)}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--tx2);cursor:pointer;font-size:12px;font-weight:600}
  .chip.on{color:#fff;border-color:transparent}
  .chip[data-p="TODAS"].on{background:#33436a}.chip[data-p="ANDINA"].on{background:#2f6fd0}
  .chip[data-p="SOUTH CONE"].on{background:#1e9e6a}.chip[data-p="MEXICO & CARIBBEAN"].on{background:#c8862c}.chip[data-p="CORP"].on{background:#7a5fc0}
  select,input[type=text],input[type=date],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none;font-family:inherit}
  input[type=text]{min-width:200px}textarea{width:100%;min-height:60px;resize:vertical}
  select:focus,input:focus,textarea:focus{border-color:var(--blue)}
  .filters .spacer{flex:1}.filters .count{font-size:12px;color:var(--tx3)}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .sec>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .sec>header h2{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
  .sec>header .n{margin-left:auto;font-size:12px;color:var(--tx3)}
  .dot{width:9px;height:9px;border-radius:99px;background:var(--c,var(--blue));box-shadow:0 0 8px var(--c,var(--blue))}
  .empty{padding:16px;color:var(--tx3);font-size:12.5px}
  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.8px;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .maptools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .maptools input[type=text]{flex:1;min-width:240px}
  .mapcount{font-size:11px;color:var(--tx3);white-space:nowrap}
  .mapscroll{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  .maptable{width:100%;border-collapse:collapse}
  .maptable thead th{position:sticky;top:0;z-index:2;background:var(--panel2);text-align:left;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3);padding:11px 14px;border-bottom:1px solid var(--line)}
  .maptable tbody td{padding:3px 10px;border-bottom:1px solid var(--line)}
  .maptable tbody tr:last-child td{border-bottom:none}
  .maptable tbody tr:hover td{background:rgba(77,163,255,.06)}
  .maptable td.pbar,.maptable th.pbar{width:4px;padding:0}
  .maptable td.pbar{border-bottom:none}
  .minp{width:100%;min-width:110px;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 9px;color:var(--tx);font-size:12.8px;font-family:inherit;transition:background .12s,border-color .12s,opacity .12s}
  .minp:hover{background:var(--panel2);border-color:var(--line)}
  .minp:focus{background:var(--panel2);border-color:var(--acc,#4da3ff);outline:none}
  .minp.dim{opacity:.3}.minp.dim:hover,.minp.dim:focus{opacity:1}
  .platpill{border-left:3px solid var(--pc,#8b93a7);border-radius:0 8px 8px 0;font-weight:600}
  .mcell{display:flex;align-items:center;gap:8px}
  .rdot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;letter-spacing:.3px}
  .mapdelcell{width:1%;text-align:center}
  .mapdelbtn{border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:14px;opacity:.45;border-radius:7px;padding:4px 8px;transition:.12s}
  .mapdelbtn:hover{opacity:1;background:rgba(224,80,80,.14);color:var(--red)}
  .mapempty{padding:18px;color:var(--tx3);text-align:center}
  tbody tr.clik{cursor:pointer}
  tbody tr.clik:hover td{background:rgba(77,163,255,.09)}
  tbody tr.del td{opacity:.45;text-decoration:line-through}
  .sub{display:block;font-size:11px;color:var(--tx3);margin-top:2px}
  .nowrap{white-space:nowrap}
  .rowbtn{cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--tx3);border-radius:7px;padding:3px 9px;font-size:13px;line-height:1}
  .rowbtn:hover{color:var(--red);border-color:var(--red)}
  .rowbtn.restore:hover{color:var(--green);border-color:var(--green)}
  .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap}
  .b-atr{background:rgba(255,92,108,.16);color:var(--red);border:1px solid rgba(255,92,108,.45)}
  .b-hoje{background:rgba(255,180,84,.16);color:var(--amber);border:1px solid rgba(255,180,84,.45)}
  .b-pen{background:rgba(77,163,255,.14);color:var(--blue);border:1px solid rgba(77,163,255,.4)}
  .b-ok{background:rgba(61,220,151,.14);color:var(--green);border:1px solid rgba(61,220,151,.4)}
  .b-sp{background:rgba(122,134,153,.16);color:var(--gray);border:1px solid rgba(122,134,153,.45)}
  .b-and{background:rgba(255,180,84,.16);color:var(--amber);border:1px solid rgba(255,180,84,.45)}
  .b-canc{background:rgba(122,134,153,.16);color:var(--gray);border:1px solid rgba(122,134,153,.45)}
  .b-sb{background:rgba(180,140,255,.16);color:var(--purple);border:1px solid rgba(180,140,255,.45)}
  .b-del{background:rgba(255,92,108,.12);color:var(--red);border:1px dashed rgba(255,92,108,.5)}
  .plat{display:inline-block;padding:2px 9px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap}
  .ktag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:9.5px;font-weight:800;white-space:nowrap;margin-right:6px;vertical-align:1px;letter-spacing:.2px}
  .k-ent{background:rgba(47,111,208,.14);color:#2f6fd0}
  .k-act{background:rgba(122,95,192,.16);color:#7a5fc0}
  .p-ANDINA{background:rgba(47,111,208,.2);color:#3f80d8}.p-SOUTHCONE{background:rgba(30,158,106,.18);color:#149a63}
  .p-MEX{background:rgba(200,134,44,.2);color:#b3781f}.p-CORP{background:rgba(122,95,192,.2);color:#7a5fc0}
  body:not(.light) .p-ANDINA{color:#79b0f5}body:not(.light) .p-SOUTHCONE{color:#4fd6a2}body:not(.light) .p-MEX{color:#f0b45e}body:not(.light) .p-CORP{color:#c3a8f7}
  .late{color:var(--red);font-weight:700}.soon{color:var(--amber);font-weight:700}.okc{color:var(--green)}.muted{color:var(--tx3)}
  .pill{display:inline-block;width:8px;height:8px;border-radius:99px;margin-left:5px;vertical-align:middle}
  .pill.c{background:var(--blue)}.pill.p{background:var(--amber)}
  .pcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px;overflow:hidden}
  .pcard>.head{padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;cursor:pointer;background:var(--panel2)}
  .pcard>.head:hover{background:var(--line)}
  .pcard .t{font-size:14.5px;font-weight:700}.pcard .who{font-size:12px;color:var(--tx2)}
  .pcard .right{margin-left:auto;display:flex;gap:18px;align-items:center}
  .bar{position:relative;width:200px;height:9px;border-radius:99px;background:var(--line)}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#2f6fd0,#4da3ff)}
  .bar .fill.bad{background:linear-gradient(90deg,#d04a58,#ff5c6c)}.bar .fill.good{background:linear-gradient(90deg,#1e9e6a,#3ddc97)}
  .bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:#ffb454}
  .pct{font-size:15px;font-weight:800;min-width:46px;text-align:right}
  .pcard .body{display:none;border-top:1px solid var(--line)}.pcard.open .body{display:block}
  .pcard.del{opacity:.5}
  .pcard .right .rowbtn{white-space:nowrap}
  .pcard .pdescr{padding:10px 18px;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--line)}
  .projtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  /* v4 A3: fila de aprovação das importações de Excel */
  .impb{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden}
  .impb .imph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:rgba(77,163,255,.08);border-bottom:1px solid var(--line);font-size:12.5px}
  .impb .imph b{font-size:13px}.impb .imph .sp{flex:1}
  .impt{width:100%;border-collapse:collapse;font-size:12px}
  .impt th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);padding:6px 10px;border-bottom:1px solid var(--line)}
  .impt td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .impt tr.imph2 td{background:rgba(255,255,255,.04);font-weight:700}
  body.light .impt tr.imph2 td{background:rgba(0,0,0,.04)}
  .impt tr.ok td{background:rgba(63,181,106,.12)}.impt tr.no td{background:rgba(255,92,92,.10);color:var(--tx3)}.impt tr.no td input,.impt tr.no td select{opacity:.6}
  .impt tr.info td{color:var(--tx3);font-style:italic}
  .impt tr.sub td{padding:2px 10px}.impt tr.sub td:first-child{padding-left:26px;color:var(--tx2)}
  .impt input,.impt select{width:100%;min-width:90px;background:transparent;border:1px solid var(--line);border-radius:6px;color:inherit;padding:3px 6px;font:inherit}
  .impt td.acts{white-space:nowrap;width:1%}.impt td.acts .btn{padding:2px 8px}
  .impt .old{color:var(--tx2)}
  /* v4: linha-cabeçalho de MARCO dentro do cartão do projeto */
  tr.mrow td{background:rgba(77,163,255,.10);border-left:3px solid var(--blue,#4da3ff);border-top:1px solid var(--line);padding:8px 14px}
  body.light tr.mrow td{background:rgba(47,111,208,.08)}
  .mrow .mk{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mrow .mkn{font-weight:700;font-size:13px}
  .mrow .mkc{font-size:11px}
  .mrow .mkr{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mrow .bar{width:120px}
  .mrow .pct{font-size:13px;min-width:40px}
  .newprojbox{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--panel)}
  .caret{color:var(--tx3);font-size:11px;transition:.2s}.pcard.open .caret{transform:rotate(90deg)}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .person{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .person .nm{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .av{width:42px;height:42px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
  .person h3{font-size:14px}.person .role{font-size:11px;color:var(--tx2)}
  .person .stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:70px;background:var(--panel2);border-radius:8px;padding:8px;text-align:center}
  .stat .v{font-size:18px;font-weight:800}.stat .l{font-size:9.5px;color:var(--tx3);text-transform:uppercase}
  .person .mail{font-size:11px;color:var(--tx3);margin-top:10px;word-break:break-all}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}.bar{width:130px}}
  .footer{margin-top:26px;text-align:center;font-size:11px;color:var(--tx3)}
  .ovl{position:fixed;inset:0;background:rgba(6,10,18,.72);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
  .ovl.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:720px;box-shadow:0 24px 60px var(--shadow)}
  .modal>.mh{display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--panel2);border-radius:16px 16px 0 0;position:sticky;top:0}
  .modal .mh h2{font-size:16px;font-weight:700;line-height:1.3}
  .modal .mh .x{margin-left:auto;cursor:pointer;color:var(--tx2);font-size:24px;line-height:1;padding:0 4px}
  .modal .mh .x:hover{color:var(--tx)}
  .modal .mb{padding:20px 22px}
  .fieldrow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .field{flex:1;min-width:150px}
  .field.full{flex-basis:100%}
  .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);margin-bottom:4px}
  .field .val{font-size:13.5px}
  .field input,.field select,.field textarea{width:100%}
  .block{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
  .block h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx2);margin-bottom:10px}
  .editbox{background:rgba(77,163,255,.06);border:1px solid rgba(77,163,255,.3);border-radius:12px;padding:14px;margin-top:16px}
  .editbox h3{color:var(--blue)}
  .thread{display:flex;flex-direction:column;gap:10px;max-height:240px;overflow-y:auto;margin-bottom:12px}
  .cmt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .cmt .meta{font-size:10.5px;color:var(--tx3);margin-bottom:3px}.cmt .meta b{color:var(--blue)}
  .cmt .txt{font-size:13px;white-space:pre-wrap}
  .hist{font-size:12px;color:var(--tx2)}
  .hist .h{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .hist .h:last-child{border-bottom:none}.hist .h .d{font-weight:700;color:var(--tx);min-width:82px}
  .sugg{background:rgba(255,180,84,.09);border:1px solid rgba(255,180,84,.4);border-radius:10px;padding:12px;margin-bottom:10px}
  .sugg .who{font-size:11px;color:var(--amber);font-weight:700;margin-bottom:5px}
  .sugg .row{font-size:12.5px;margin:3px 0}.sugg .acts{display:flex;gap:8px;margin-top:10px}
  .note{font-size:11.5px;color:var(--tx3);margin-top:6px}
  .modalfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e9e6a;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:.25s;box-shadow:0 8px 24px var(--shadow)}
  .toast.on{opacity:1}
  .outbar{position:fixed;bottom:18px;right:18px;z-index:90;display:none;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--blue);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px var(--shadow)}
  .outbar.on{display:flex}

  @media(max-width:760px){
    .top{padding:10px 12px;gap:8px;flex-wrap:wrap}
    .top .meta{display:none}
    .logo h1{font-size:13px}

    .sec{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .sec table{min-width:640px}
    /* Tabela de entregáveis vira CARTÕES no celular (leitura amigável) */
    .sec .enttbl{min-width:0}
    .enttbl thead{display:none}
    .enttbl tbody,.enttbl tr,.enttbl td{display:block;width:auto}
    .enttbl tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:10px 13px;background:var(--panel2)}
    .enttbl tr td{border:none;padding:4px 0;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:14px;white-space:normal;text-align:right}
    .enttbl tr td::before{content:attr(data-label);color:var(--tx3);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex:0 0 auto;text-align:left}
    .enttbl tr td.entcell{display:block;text-align:left;font-weight:700;font-size:15px;color:var(--tx);margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
    .enttbl tr td.entcell::before{display:none}
    .enttbl tr td.entcell .sub{display:block;font-weight:400;margin-top:3px}
    .enttbl tr td.numc{display:none}
    .enttbl tr.del td{opacity:.5}
    .pcard .body{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .pcard .body table{min-width:640px}
    .pcard .right{gap:8px;flex-wrap:wrap}
    .bar{width:80px}
    .mrow .bar{width:80px}.mrow .mkr{gap:8px}
    .ovl{padding:12px 6px}
    .modal .mb{padding:14px 12px}
    .modal>.mh{padding:14px 14px}
    input[type=text]{min-width:110px}
    .tab{padding:8px 12px;font-size:12px}
    .actbar{margin-left:0;flex-wrap:wrap}
  }
</style>
</head>

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(iso){if(!iso)return '—';const p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]:iso;}
function fmtY(iso){if(!iso)return '—';const p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function nowStamp(){const d=new Date();const z=n=>('0'+n).slice(-2);return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes());}
function daysTo(iso){if(!iso)return null;return Math.round((new Date(iso+'T00:00:00')-new Date(DATA.hoje+'T00:00:00'))/86400000);}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2600);}
function shortNameJS(n){if(!n)return '';n=n.trim();
  if(/^jonathan/i.test(n))return 'Jonathan';if(/^jo.o/i.test(n))return 'João';if(/^caio/i.test(n))return 'Caio';
  if(/^jorge/i.test(n))return 'Jorge';if(/^noe/i.test(n))return 'Noé';if(/^c.sar|^cesar/i.test(n))return 'César';
  if(/^alejandro/i.test(n))return 'Alejandro';if(/^vit.ria|^vitoria/i.test(n))return 'Vitória';return n.split(/\s+/)[0];}

function applyTheme(mode){const b=document.body;if(mode==='light')b.classList.add('light');else b.classList.remove('light');
  const btn=document.getElementById('themebtn');if(btn)btn.textContent=(mode==='light')?'☀️ Claro':'🌙 Escuro';
  try{localStorage.setItem('rm_theme',mode);}catch(e){}}
function toggleTheme(){applyTheme(document.body.classList.contains('light')?'dark':'light');}

/* ---------- overlay ---------- */
function ovLookup(id){return DATA.overlay.items[id]||null;}
function ovItem(id){let it=DATA.overlay.items[id];if(!it){it={official:{},dateHistory:[],comments:[],suggestions:[]};DATA.overlay.items[id]=it;}
  it.official=it.official||{};it.dateHistory=A(it.dateHistory);it.comments=A(it.comments);it.suggestions=A(it.suggestions);return it;}
function ovOf(id,f){if(MODE!=='admin')return null;const ov=ovLookup(id);return (ov&&ov.official&&ov.official[f]!=null&&ov.official[f]!=='')?ov.official[f]:null;}
function pendingCount(){let n=0;for(const k in DATA.overlay.items){n+=A(DATA.overlay.items[k].suggestions).filter(x=>!x.state||x.state==='pending').length;}return n+(onlinePending||0)+impPendingN();}

/* ---------- valores efetivos (overlay > base) ---------- */
function entMaterial(e){return ovOf(e.id,'material')||e.material;}
function entResp(e){return ovOf(e.id,'resp')||e.resp;}
function entCurto(e){const r=ovOf(e.id,'resp');return r?shortNameJS(r):e.curto;}
function entPlat(e){return ovOf(e.id,'plat')||e.plat;}
function entDeleted(e){return MODE==='admin'?!!ovOf(e.id,'deleted'):!!e.deleted;}
function actAtiv(a){return ovOf(a.id,'ativ')||a.ativ;}
function actResp(a){return ovOf(a.id,'resp')||a.resp;}
function actCurto(a){const r=ovOf(a.id,'resp');return r?shortNameJS(r):a.curto;}
function actDeleted(a){
  if(MODE!=='admin')return !!a.deleted;
  if(!!ovOf(a.id,'deleted'))return true;
  const p=PROJOF[a.id];
  return (p&&projDeleted(p)&&actStatus(a)!=='Concluído')?true:false;
}
function actFim(a){if(MODE!=='admin')return a.fim;const ov=ovLookup(a.id),o=ov&&ov.official?ov.official:{};return o.limite||a.baseFim||a.fim||null;}
function actIni(a){if(MODE!=='admin')return a.inicio||null;return ovOf(a.id,'inicio')||a.inicio||null;}
function actPrev(a){if(MODE!=='admin')return a.prev;const ini=actIni(a),fim=actFim(a);if(!ini||!fim)return a.prev||0;
  const i=new Date(ini+'T00:00:00'),f=new Date(fim+'T00:00:00'),hh=new Date(DATA.hoje+'T00:00:00');
  if(f<i)return a.prev||0;const p=((hh-i)/86400000+1)/((f-i)/86400000+1);return Math.max(0,Math.min(1,p));}

/* ---------- v4.0 Projeto → Marco → Atividade ----------
   Marcos de um projeto (qualquer id: P…, NP_…, NPJ…) vivem em overlay.items[projId].official.marcos
   [{id:'MK…',nome,ordem,deleted}]. A atividade liga ao marco por official.marcoId (ou ni.marcoId) e
   official.fase guarda o NOME do marco (compatível com e-mail/painéis view). '__none__' em marcoId = "sem marco"
   explícito (para sobrepor um marcoId que veio da base). Em view os acessores devolvem o dado do gerador. */
const SEMK='(Sem marco)',SEM_ID='__sem__';
function nk(s){return String(s==null?'':s).trim().toLowerCase();}
function escA(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function jq(s){return encodeURIComponent(String(s==null?'':s)).replace(/'/g,'%27');}
function actFase(a){return (MODE==='admin'?(ovOf(a.id,'fase')||a.fase):a.fase)||'';}
function actMarcoId(a){const v=(MODE==='admin')?(ovOf(a.id,'marcoId')||a.marcoId):a.marcoId;return (v&&v!=='__none__')?v:null;}
function marcosRaw(p){let src;if(MODE==='admin'){const o=ovOf(p.id,'marcos');src=(o!=null)?A(o):A(p.marcos);}else src=A(p.marcos);
  return src.filter(m=>m&&m.id&&!m.deleted).slice().sort((x,y)=>(+x.ordem||0)-(+y.ordem||0));}
function marcosArr(pid){const it=ovItem(pid);if(!Array.isArray(it.official.marcos))it.official.marcos=A(it.official.marcos);return it.official.marcos;}
function projNome(p){return (MODE==='admin'?ovOf(p.id,'nome'):null)||p.nome||'';}
function projResp(p){return (MODE==='admin'?ovOf(p.id,'resp'):null)||p.resp||'';}
function projCurto(p){const r=(MODE==='admin')?ovOf(p.id,'resp'):null;return r?shortNameJS(r):(p.curto||'');}
function projPlat(p){return (MODE==='admin'?ovOf(p.id,'plat'):null)||p.plat||'CORP';}
function projDescr(p){return (MODE==='admin'?ovOf(p.id,'descricao'):null)||p.descricao||'';}
function projIni(p){return (MODE==='admin'?ovOf(p.id,'inicio'):null)||p.inicio||null;}
/* Grupos (marcos) do projeto: explícitos por ordem + implícitos pelo nome da fase + "(Sem marco)" no fim.
   g = {id,nome,ordem,explicit,acts[]} — acts inclui as excluídas (os rollups filtram). */
function projMarcos(p){
  const ex=marcosRaw(p).map(m=>({id:m.id,nome:m.nome||'',ordem:+m.ordem||0,explicit:true,acts:[]}));
  const byId={},byName={};ex.forEach(g=>{byId[g.id]=g;if(!byName[nk(g.nome)])byName[nk(g.nome)]=g;});
  const imp=[],impBy={};let sem=null;
  A(p.atividades).forEach(a=>{
    const mid=actMarcoId(a);let g=mid?byId[mid]:null;
    if(!g){const fs=String(actFase(a)||'').trim();
      if(!fs||nk(fs)===nk(SEMK)){g=sem||(sem={id:SEM_ID,nome:SEMK,ordem:99999,explicit:false,acts:[]});}
      else if(byName[nk(fs)])g=byName[nk(fs)];
      else{g=impBy[nk(fs)];if(!g){g={id:'fase:'+fs,nome:fs,ordem:50000+imp.length,explicit:false,acts:[]};impBy[nk(fs)]=g;imp.push(g);}}}
    g.acts.push(a);});
  return (MODE==='admin'?ex:ex.filter(g=>g.acts.length)).concat(imp,sem?[sem]:[]);}
function actMarcoNome(a){const p=PROJOF[a.id];
  const mid=actMarcoId(a);
  if(mid&&p){const m=marcosRaw(p).find(x=>x.id===mid);if(m&&m.nome)return m.nome;}
  return actFase(a)||SEMK;}
/* v4.0 C1: cancelada nunca entra no %; atividade com status efetivo Concluído conta 1.0 (rollPct) — mesma regra do gerador.
   Em view actStatus não vê a overlay: usa o status já calculado pelo gerador (a.st). */
function actCancel(a){return actStatus(a)==='Cancelado'||(MODE!=='admin'&&a.st==='Cancelado');}
function rollPct(a){if(MODE==='admin'){if(actStatus(a)==='Concluído')return 1;}else if(a.st==='Concluído')return 1;return effPct(a);}
function marcoActs(m){return m.acts.filter(a=>a.ativ&&!actDeleted(a)&&!actCancel(a));}
function marcoPct(m){const L=marcoActs(m);if(!L.length)return 0;return L.reduce((s,a)=>s+rollPct(a),0)/L.length;}
function marcoIni(m){let mn=null;marcoActs(m).forEach(a=>{const i=actIni(a);if(i&&(!mn||i<mn))mn=i;});return mn;}
function marcoFim(m){let mx=null;marcoActs(m).forEach(a=>{const f=actFim(a);if(f&&(!mx||f>mx))mx=f;});return mx;}
function marcoPrev(m){const ini=marcoIni(m),fim=marcoFim(m);if(!ini||!fim)return 0;
  const i=new Date(ini+'T00:00:00'),f=new Date(fim+'T00:00:00'),hh=new Date(DATA.hoje+'T00:00:00');
  if(f<i)return 0;const x=((hh-i)/86400000+1)/((f-i)/86400000+1);return Math.max(0,Math.min(1,x));}
function marcoStatus(m){const L=marcoActs(m);
  if(!L.length)return (m.acts.some(a=>a.ativ&&!actDeleted(a)))?'Cancelado':'Pendente';
  const pct=marcoPct(m),fim=marcoFim(m),prev=marcoPrev(m);
  if(pct>=0.999)return 'Concluído';if(fim&&daysTo(fim)<0)return 'Atrasado';if(pct<prev-0.001&&prev>0)return 'Abaixo do plano';if(pct>0)return 'Em andamento';return 'Pendente';}

/* ---------- rotinas (editáveis no sistema) ---------- */
function rotAtiv(r){return ovOf(r.id,'ativ')||r.ativ;}
function rotResp(r){return ovOf(r.id,'resp')||r.resp;}
function rotCurto(r){const x=ovOf(r.id,'resp');return x?shortNameJS(x):r.curto;}
function rotPeriod(r){return ovOf(r.id,'period')||r.period;}
function rotDeleted(r){return MODE==='admin'?!!ovOf(r.id,'deleted'):!!r.deleted;}
function rotDia(r){const d=ovOf(r.id,'diaUtil');return (d!=null&&d!=='')?d:(r.diaUtil!=null?r.diaUtil:'');}
function nthBusinessDay(y,m,n){const d=new Date(y,m,1);let c=0;for(;;){const w=d.getDay();if(w!==0&&w!==6){c++;if(c===n)return new Date(d);}d.setDate(d.getDate()+1);}}
function isoOf(d){const z=n=>('0'+n).slice(-2);return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function nextWD(n){const h=new Date(DATA.hoje+'T00:00:00');let d=nthBusinessDay(h.getFullYear(),h.getMonth(),n);if(d<h)d=nthBusinessDay(h.getFullYear(),h.getMonth()+1,n);return isoOf(d);}
function effRot(r){const d=rotDia(r);const n=parseInt(d,10);
  if(!isNaN(n)&&n>=1)return {prazoPad:'WD+'+n,proxPrazo:nextWD(n)};
  return {prazoPad:r.prazoPad,proxPrazo:r.proxPrazo};}
function notDeletedRot(){return A(DATA.rotinas).filter(r=>!rotDeleted(r));}

function effEnt(e){
  if(MODE!=='admin')return {limite:e.limite,recebTxt:e.recebidoTxt,st:e.st,dias:e.dias};
  const ov=ovLookup(e.id),o=ov&&ov.official?ov.official:{};
  const limite=o.limite||e.baseLimite;
  const recebTxt=o.recebido||e.baseRecebTxt||'';
  const statusOv=o.status||'';
  let dias=limite?daysTo(limite):null,st='Pendente';
  if(/cancel/i.test(statusOv))st='Cancelado';
  else if(!!recebTxt||/conclu/i.test(statusOv))st='Concluído';
  else if(!limite)st='Sem prazo';else if(dias<0)st='Atrasado';else if(dias===0)st='Hoje';
  return {limite,recebTxt,st,dias};
}
function effPct(a){if(MODE!=='admin')return a.pct;const ov=ovLookup(a.id);return (ov&&ov.official&&ov.official.pct!=null)?ov.official.pct:a.pct;}
function actStatus(a){const ov=ovLookup(a.id),o=ov&&ov.official?ov.official:{};
  if(/cancel/i.test(o.status||''))return 'Cancelado';
  if(/conclu/i.test(o.status||''))return 'Concluído';
  const pct=effPct(a),prev=actPrev(a),fim=actFim(a);
  if(pct>=0.999)return 'Concluído';if(fim&&daysTo(fim)<0)return 'Atrasado';if(pct<prev-0.001&&prev>0)return 'Abaixo do plano';if(pct>0)return 'Em andamento';return 'Pendente';}

/* ---------- atividade de projeto vista como "ação com prazo" (Visão Geral) ----------
   actStatus() mistura data e progresso (Em andamento / Abaixo do plano) e não tem
   Hoje / Sem prazo. Para cair nos mesmos grupos do entregável, classificamos pela
   DATA (actFim), mantendo o progresso em .prog para exibir junto. */
function allActs(){const out=[];A(DATA.projetos).forEach(p=>{A(p.atividades).forEach(a=>{if(a&&a.id)out.push(a);});});return out;}
function notDeletedAct(){return allActs().filter(a=>!actDeleted(a));}
function actPlat(a){const p=PROJOF[a.id];return p?projPlat(p):'CORP';}
function actProjNome(a){const p=PROJOF[a.id];return p?projNome(p):'';}
function actMes(a){const f=actFim(a);if(!f)return '';return new Date(f+'T00:00:00').toLocaleDateString('pt-BR',{month:'long'});}
function effAct(a){
  const prog=actStatus(a),fim=actFim(a);
  const dias=fim?daysTo(fim):null;
  /* projeto pai em Stand By/Cancelado vence a classificação da filha, desde que ela
     mesma não esteja concluída (actStatus, o "próprio status" da aba Projetos, não muda). */
  const p=PROJOF[a.id],pOv=p?projStatusOv(p):null;
  if((pOv==='Stand By'||pOv==='Cancelado')&&prog!=='Concluído')return {limite:fim,st:pOv,dias:dias,prog:prog};
  let st='Pendente';
  if(prog==='Cancelado')st='Cancelado';
  else if(prog==='Concluído')st='Concluído';
  else if(!fim)st='Sem prazo';
  else if(dias<0)st='Atrasado';
  else if(dias===0)st='Hoje';
  return {limite:fim,st:st,dias:dias,prog:prog};
}
function ativosAct(l){return l.filter(a=>{const s=effAct(a).st;return s!=='Concluído'&&s!=='Cancelado'&&s!=='Stand By';});}

function stBadgeEnt(e){const ef=effEnt(e),st=ef.st;

  if(st==='Hoje')return '<span class="badge b-hoje">● '+stTxt('Hoje')+'</span>';

function projBadge(st){
  if(st==='Concluído')return '<span class="badge b-ok">✔ '+stTxt('Concluído')+'</span>';
  if(st==='Cancelado')return '<span class="badge b-canc">✕ '+stTxt('Cancelado')+'</span>';

  return '<span class="badge b-sp">⏳ '+stTxt('Pendente')+'</span>';}
function platTag(p){return '<span class="plat '+(PCLS[p]||'p-CORP')+'">'+esc(p)+'</span>';}
function markers(item){let h='';if(item.nComments)h+='<span class="pill c" title="comentários"></span>';
  if(MODE==='admin'){const ov=ovLookup(item.id);const p=ov?A(ov.suggestions).filter(x=>!x.state||x.state==='pending').length:0;if(p)h+='<span class="pill p" title="sugestões pendentes"></span>';}return h;}
function diasCellEf(ef,doneTxt){
  if(ef.st==='Concluído')return '<span class="okc">'+(doneTxt?fmt(doneTxt):'—')+'</span>';

function diasCell(e){const ef=effEnt(e);return diasCellEf(ef,ef.recebTxt);}

const ENTBY={},ACTBY={},ROTBY={},PROJOF={},PROJBY={};

/* célula de ação (excluir/restaurar) — só admin */

function tdDel(id,kind){if(MODE!=='admin')return '';
  const del=(kind==='ent')?entDeleted(ENTBY[id]):actDeleted(ACTBY[id]);
  if(del)return '<td class="nowrap"><button class="rowbtn restore" title="'+t.restore+'" onclick="event.stopPropagation();restoreItem(\''+id+'\',\''+kind+'\')">♻</button></td>';

function notDeletedEnt(){return A(DATA.entregaveis).filter(e=>!entDeleted(e));}
function filtered(){let base=A(DATA.entregaveis).filter(e=>state.showDeleted?true:!entDeleted(e));
  const mesNow=state.quick?new Date(DATA.hoje+'T00:00:00').toLocaleDateString('pt-BR',{month:'long'}):'';
  return base.filter(e=>{const ef=effEnt(e);
    if(state.plat!=='TODAS'&&entPlat(e)!==state.plat)return false;
    if(state.resp&&entCurto(e)!==state.resp)return false;
    if(state.status&&ef.st!==state.status)return false;
    if(state.mes&&e.mes!==state.mes)return false;
    if(state.quick==='7d'&&!(ef.st==='Pendente'&&ef.dias>=1&&ef.dias<=7))return false;
    if(state.quick==='donemonth'&&!(ef.st==='Concluído'&&e.mes===mesNow))return false;
    if(state.quick==='ontime'&&!(ef.st==='Concluído'&&e.mes===mesNow&&!(ef.recebTxt&&ef.limite&&ef.recebTxt>ef.limite)))return false;
    if(state.busca){const s=(entMaterial(e)+' '+(e.coment||'')+' '+entResp(e)).toLowerCase();if(!s.includes(state.busca.toLowerCase()))return false;}
    return true;});}
function ativos(l){return l.filter(e=>{const s=effEnt(e).st;return s!=='Concluído'&&s!=='Cancelado';});}
/* mesmo conjunto de filtros do entregável, aplicado à atividade de projeto.
   plataforma vem do projeto pai (atividade não tem campo plat); mês vem do prazo. */
function filteredActs(){let base=allActs().filter(a=>state.showDeleted?true:!actDeleted(a));
  return base.filter(a=>{const ef=effAct(a);
    if(state.plat!=='TODAS'&&actPlat(a)!==state.plat)return false;
    if(state.resp&&actCurto(a)!==state.resp)return false;
    if(state.status&&ef.st!==state.status)return false;
    if(state.mes&&actMes(a)!==state.mes)return false;
    if(state.quick==='7d'&&!(ef.st==='Pendente'&&ef.dias>=1&&ef.dias<=7))return false;
    if(state.quick==='donemonth'||state.quick==='ontime')return false; /* KPIs só de entregáveis */
    if(state.busca){const s=(actAtiv(a)+' '+(a.coment||'')+' '+actResp(a)+' '+actProjNome(a)).toLowerCase();if(!s.includes(state.busca.toLowerCase()))return false;}
    return true;});}

/* itens = wrappers {k:'ent'|'act', o:item, ef:efetivo} — tabela única dos dois tipos */
function tabela(itens,vazio){if(!itens.length)return '<div class="empty">'+(vazio||'—')+'</div>';

function secao(titulo,cor,itens,vazio){return '<div class="sec"><header style="--c:'+cor+'"><span class="dot" style="--c:'+cor+'"></span><h2>'+titulo+'</h2><span class="n">'+itens.length+'</span></header>'+tabela(itens,vazio)+'</div>';}

function renderVisao(){
  /* entregáveis + atividades de projeto na MESMA lista, agrupados por prazo */
  const wE=ativos(filtered()).map(e=>({k:'ent',o:e,ef:effEnt(e)}));
  const wA=ativosAct(filteredActs()).map(a=>({k:'act',o:a,ef:effAct(a)}));
  const act=wE.concat(wA);
  const srt=(a,b)=>{const x=a.ef.dias,y=b.ef.dias;if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return x-y;};
  const g=st=>act.filter(x=>x.ef.st===st).sort(srt);
  const atr=g('Atrasado');
  const hj=g('Hoje');
  const p7=act.filter(x=>x.ef.st==='Pendente'&&x.ef.dias>=1&&x.ef.dias<=7).sort(srt);
  const sp=g('Sem prazo');
  const p30=act.filter(x=>x.ef.st==='Pendente'&&x.ef.dias>=8&&x.ef.dias<=30).sort(srt);
  let h='';
  h+=secao(t.s1,'var(--red)',atr,t.ok1)+secao(t.s2,'var(--amber)',hj,t.ok2)+secao(t.s3,'var(--blue)',p7,t.ok3)+secao(t.s4,'var(--gray)',sp,t.ok4)+secao(t.s5,'var(--purple)',p30,t.ok5);
  const pr=A(DATA.projetos).filter(p=>{if(projDeleted(p))return false;const s=projConsolStatus(p);return s==='Atrasado'||s==='Abaixo do plano';});
  if(pr.length){h+='<div class="sec"><header style="--c:var(--red)"><span class="dot" style="--c:var(--red)"></span><h2>'+t.projRisco+'</h2><span class="n">'+pr.length+'</span></header><table><thead><tr><th>'+t.thProj+'</th><th>'+t.thResp+'</th><th>'+t.thPer+'</th><th>'+t.thReal+'</th><th>'+t.thPrev+'</th><th>'+t.thStatus+'</th></tr></thead><tbody>';
    for(const p of pr){const pc=projConsolPct(p);h+='<tr class="clik" ondblclick="setTab(\'proj\')" onclick="setTab(\'proj\')"><td><b>'+esc(projNome(p))+'</b></td><td>'+esc(projCurto(p))+'</td><td class="nowrap">'+fmt(projConsolIni(p))+' → '+fmt(projConsolFim(p))+'</td><td><b>'+Math.round(pc*100)+'%</b></td><td class="muted">'+Math.round(projConsolPrev(p)*100)+'%</td><td>'+projBadge(projConsolStatus(p))+'</td></tr>';}
    h+='</tbody></table></div>';}
  if(MODE==='admin'){
    /* carga = entregáveis + atividades (mesma base da lista acima, sem filtros) */
    const vis=ativos(notDeletedEnt()).map(e=>({curto:entCurto(e),plat:entPlat(e),ef:effEnt(e)}))
      .concat(ativosAct(notDeletedAct()).map(a=>({curto:actCurto(a),plat:actPlat(a),ef:effAct(a)})));

function projConsolPct(p){const ats=A(p.atividades).filter(a=>a.ativ&&!actDeleted(a)&&!actCancel(a));if(!ats.length)return p.pct;return ats.reduce((s,a)=>s+rollPct(a),0)/ats.length;}
function projConsolFim(p){if(MODE!=='admin')return p.fim;
  const ats=A(p.atividades).filter(a=>a.ativ&&!actDeleted(a)&&actStatus(a)!=='Cancelado');
  let mx=null;for(const a of ats){const f=actFim(a);if(f&&(!mx||f>mx))mx=f;}return mx||p.fim;}
function projConsolIni(p){if(MODE!=='admin')return projIni(p);
  const o=ovOf(p.id,'inicio');if(o)return o;
  let mn=null;A(p.atividades).filter(a=>a.ativ&&!actDeleted(a)&&actStatus(a)!=='Cancelado').forEach(a=>{const i=actIni(a);if(i&&(!mn||i<mn))mn=i;});return mn||projIni(p);}
function projConsolPrev(p){if(MODE!=='admin')return p.prev;const ini=projConsolIni(p),fim=projConsolFim(p);if(!ini||!fim)return p.prev||0;
  const i=new Date(ini+'T00:00:00'),f=new Date(fim+'T00:00:00'),hh=new Date(DATA.hoje+'T00:00:00');
  if(f<i)return p.prev||0;const x=((hh-i)/86400000+1)/((f-i)/86400000+1);return Math.max(0,Math.min(1,x));}

function normPlat(p){p=(p||'').trim();const u=p.toUpperCase();
  if(/ANDE|ANDIN/.test(u))return 'ANDINA';
  if(/SOUTH|CONE|\bSUR\b/.test(u))return 'SOUTH CONE';

  if(/CORP/.test(u))return 'CORP';

function rotCountries(){const seen={},out=[];
  activeMap().forEach(r=>{const c=(r.country||'').trim();if(!c||seen[c])return;seen[c]=1;
    out.push({country:c,regional:(r.regional||'').trim(),platform:(r.platform||'').trim(),curto:shortNameJS(r.regional||'')});});
  return out.sort((a,b)=>a.country.localeCompare(b.country));}
function rotBatchItems(rotId,mesRef){const out=[];
  A(DATA.overlay.newItems).forEach(ni=>{if(!ni||ni.kind!=='entregavel'||ni.srcRot!==rotId||ni.mesRef!==mesRef||!ni.country)return;
    const ov=ovLookup(ni.id);if(ov&&ov.official&&ov.official.deleted)return;out.push(ni);});
  return out;}
function rotBatchExisting(rotId,mesRef){const s=new Set();rotBatchItems(rotId,mesRef).forEach(ni=>s.add(ni.country));return s;}
/* Um entregável do lote está "desatualizado" se o texto/data efetivos divergem da rotina atual. */
function rotItemStale(ni,expText,expDate){const effMat=(ovOf(ni.id,'material')||ni.material||'');const effLim=(ovOf(ni.id,'limite')||ni.limite||'');
  if(effMat!==(expText+' — '+ni.country))return true;if(expDate&&effLim!==expDate)return true;return false;}
function rotGenState(r){const base=effRot(r).proxPrazo||'';const mesRef=base.slice(0,7);
  const items=mesRef?rotBatchItems(r.id,mesRef):[];const expText=rotAtiv(r);
  let stale=false;items.forEach(ni=>{if(rotItemStale(ni,expText,base))stale=true;});
  return {mesRef:mesRef,total:rotCountries().length,done:items.length,stale:stale};}

function applyActMarco(a,it,val){const o=it.official;const baseMk=a.marcoId||null;
  if(!val){o.marcoId=baseMk?'__none__':null;o.fase=(a.fase||baseMk)?SEMK:null;return;}
  if(val.indexOf('fase:')===0){o.marcoId=baseMk?'__none__':null;o.fase=val.slice(5);return;}
  const p=PROJOF[a.id];const g=p?projMarcos(p).find(x=>x.id===val):null;
  if(g){o.marcoId=g.id;o.fase=g.nome;}}

function saveProj(id){const p=PROJBY[id];const it=ovItem(id);const g=x=>{const el=document.getElementById(x);return el?(el.value||'').trim():'';};
  const v=g('edProjStatus');
  const nm=g('edProjNome'),rp=g('edProjResp'),pl=g('edProjPlat'),ini=g('edProjIni'),ds=g('edProjDescr');
  /* override só quando difere da base (null = herda a base) */
  /* C1: p.nome/resp/... já vêm com override aplicado → comparar com p.base* (valor da planilha/projdef) */

  it.official.resp=(rp&&p&&rp!==(bs('Resp',p.resp)||''))?rp:null;
  it.official.plat=(pl&&p&&pl!==(bs('Plat',p.plat)||'CORP'))?pl:null;
  it.official.inicio=(ini&&p&&ini!==(bs('Inicio',p.inicio)||''))?ini:null;
  it.official.descricao=(ds&&p&&ds!==(bs('Descricao',p.descricao)||''))?ds:null;

function approveSugg(id,idx){const it=ovItem(id);const s=it.suggestions[idx];if(!s)return;const item=ENTBY[id]||ACTBY[id];

  if(s.propStatus)it.official.status=s.propStatus;

  if(s.propPct!=null&&s.propPct!=='')it.official.pct=Math.max(0,Math.min(1,parseFloat(s.propPct)));
  if(s.comment)it.comments.push({ts:nowStamp(),by:(s.from||'?'),text:s.comment});
  s.state='approved';s.resolvedTs=nowStamp();markDirty(id);

  refreshAll();toast(t.savedOk);}

/* ---------- Firebase (comentários online) ---------- */
const FB={db:null,ready:false,error:null};let _fbPromise=null;
function fbCfg(){const f=DATA.firebase;return (f&&f.apiKey&&f.projectId)?f:null;}
function fbLoadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}
function ensureFB(){
  if(FB.db)return Promise.resolve(FB.db);
  if(!fbCfg())return Promise.resolve(null);
  if(_fbPromise)return _fbPromise;
  _fbPromise=(async()=>{try{
    if(!window.firebase){
      await fbLoadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');

async function connectBase(){try{fileHandle=null;await idbSet('overlayHandle',null);const h=await ensureHandle(true);if(h){await syncFromDisk(true);toast('✔ base conectada — data\\board.overlay.json');}}catch(e){toast('❌ '+e.message);}}
/* Lê o overlay do disco e mescla com o que está em memória.
   Regra: o DISCO é a base; só vencem os itens alterados NESTA sessão.
   Assim, uma aba antiga nunca sobrescreve edições salvas por outra aba/dia. */
function mergeFromDisk(disk){
  if(!disk||typeof disk!=='object')return;
  const mem=DATA.overlay;mem.items=mem.items||{};
  const dItems=(disk.items&&typeof disk.items==='object')?disk.items:{};
  const items={};
  for(const id in dItems)items[id]=dItems[id];
  for(const id in mem.items){
    if(!items[id]){items[id]=mem.items[id];continue;}
    if(sessionTouched.has(id)){
      /* C1: marcos = união por id (memória vence por id; ids só do disco são mantidos) */
      const dM=A(items[id]&&items[id].official&&items[id].official.marcos);
      const mi=mem.items[id];mi.official=mi.official||{};
      if(dM.length||Array.isArray(mi.official.marcos)){
        const mm=A(mi.official.marcos),seen={};
        const un=mm.filter(m=>m&&m.id).map(m=>{seen[m.id]=1;return m;});
        dM.forEach(m=>{if(m&&m.id&&!seen[m.id])un.push(m);});
        mi.official.marcos=un;}
      items[id]=mi;}}
  const byId={};
  A(disk.newItems).forEach(n=>{if(n&&n.id)byId[n.id]=n;});
  A(mem.newItems).forEach(n=>{if(n&&n.id&&(sessionNewIds.has(n.id)||!byId[n.id]))byId[n.id]=n;});
  mem.items=items;mem.newItems=Object.keys(byId).map(k=>byId[k]);
  // Mapa Regional: mesma regra — o disco é a base; só as linhas tocadas nesta sessão vencem.
  // Tombstones (deleted) ficam preservados por id, então uma exclusão não "ressuscita".
  const mapById={};
  A(disk.regionalMap).forEach(r=>{if(r&&r.id)mapById[r.id]=r;});
  A(mem.regionalMap).forEach(r=>{if(r&&r.id&&(mapTouched.has(r.id)||!mapById[r.id]))mapById[r.id]=r;});
  mem.regionalMap=Object.keys(mapById).map(k=>mapById[k]);
  // Fila de importação Excel (v4): união por id do lote; o lote tocado nesta sessão (importTouched) vence.
  const ibById={};
  A(disk.importBatches).forEach(b=>{if(b&&b.id)ibById[b.id]=b;});
  A(mem.importBatches).forEach(b=>{if(b&&b.id&&(importTouched.has(b.id)||!ibById[b.id]))ibById[b.id]=b;});
  if(Object.keys(ibById).length||mem.importBatches!==undefined)mem.importBatches=Object.keys(ibById).map(k=>ibById[k]);
  // Sugestões online já tratadas (aprovadas/rejeitadas): união disco + sessão (marcador monotônico)
  mem.handledSuggestions=Object.assign({},disk.handledSuggestions||{},mem.handledSuggestions||{});
  if(disk.version!=null)mem.version=disk.version;
}
async function readDisk(h){const f=await h.getFile();const txt=await f.text();if(!txt||!txt.trim())return null;return JSON.parse(txt);}
/* Sincroniza a base do disco para a memória (ao abrir o painel e ao conectar). */
async function syncFromDisk(interactive){
  if(MODE!=='admin'||!('showOpenFilePicker' in window))return false;
  try{
    if(!fileHandle){try{fileHandle=await idbGet('overlayHandle');}catch(e){}}
    if(!fileHandle)return false;
    let p=await fileHandle.queryPermission({mode:'readwrite'});
    if(p!=='granted'&&interactive)p=await fileHandle.requestPermission({mode:'readwrite'});
    if(p!=='granted')return false;
    const embUpd=DATA.overlay.updated||'';
    const disk=await readDisk(fileHandle);
    if(disk){mergeFromDisk(disk);injectNewItems();refreshAll();
      if((disk.updated||'')!==embUpd)toast('🔄 Base sincronizada do disco ('+(disk.updated||'?')+')');}
    baseLoaded=true;renderTabs();
    return true;
  }catch(e){return false;}
}

  items.forEach(c=>{const cl=impCls(c),ro=(c.state==='applied');
    if(c.type==='missing'){h+='<tr class="info"><td colspan="4">⚠ '+esc(c.ativ||c.itemId)+' — '+t.impMissing+'</td></tr>';}
    else if(c.type==='edit'){h+='<tr class="'+cl+'"><td>'+esc(c.label)+'</td><td class="old">'+impFmtVal(c.field,c.old)+'</td><td>'+impInp(b.id,c.cid,c.field,c.new,ro)+'</td>'+impBtns(b,c)+'</tr>';}
    else if(c.type==='comment'){h+='<tr class="'+cl+'"><td>💬 '+esc(c.label)+'</td><td class="old">—</td><td>'+impInp(b.id,c.cid,'comment',c.new,ro)+'</td>'+impBtns(b,c)+'</tr>';}
    else if(c.type==='new-marco'){h+='<tr class="'+cl+'"><td>🏁 '+esc(c.label)+'</td><td class="old">—</td><td><b>'+esc(c.marcoNome)+'</b></td>'+impBtns(b,c)+'</tr>';}
    else if(c.type==='new-project'){h+='<tr class="imph2 '+cl+'"><td colspan="3">🆕 '+esc(c.label)+': '+esc(c.new.nome)+'</td>'+impBtns(b,c)+'</tr>';
      ['nome','resp','plat','descricao'].forEach(f=>{h+='<tr class="'+cl+' sub"><td>'+esc(t['impF_'+f])+'</td><td class="old">—</td><td colspan="2">'+impInp(b.id,c.cid,f,c.new[f],ro)+'</td></tr>';});}
    else if(c.type==='new-act'){h+='<tr class="imph2 '+cl+'"><td colspan="3">🆕 '+t.impNew+' — '+esc(c.new.ativ)+'</td>'+impBtns(b,c)+'</tr>';
      [['ativ',c.new.ativ],['marco',c.marcoNome],['resp',c.new.resp],['inicio',c.new.inicio],['fim',c.new.fim],['pct',c.new.pct],['status',c.new.status],['comment',c.new.comment]].forEach(x=>{
        h+='<tr class="'+cl+' sub"><td>'+esc(t['impF_'+x[0]])+'</td><td class="old">—</td><td colspan="2">'+impInp(b.id,c.cid,x[0],x[1],ro)+'</td></tr>';});}
  });return h;}
function impBatchHtml(b){
  const ch=A(b.changes),done=b.state==='done';
  const nP=ch.filter(c=>c.state==='pending').length,nA=ch.filter(c=>c.state==='approved').length,nAp=ch.filter(c=>c.state==='applied').length;
  let h='<div class="impb" id="ib_'+b.id+'"><div class="imph"><b>📄 '+esc(b.file)+'</b><span>'+t.impProj+': <b>'+esc(b.projNome||'')+'</b>'+(b.newProject?' · '+t.impNewProj:'')+'</span><span class="muted">'+esc(b.ts||'')+' · '+esc(b.by||'')+'</span>'
    +'<span class="sp"></span><span>'+nP+' '+t.impPend+(nA?' · '+nA+' ✔':'')+(nAp?' · '+nAp+' '+t.impApplied:'')+'</span>';
  if(!done)h+='<button class="btn green sm" onclick="impAll(\''+b.id+'\',\'approved\')">'+t.impApproveAll+'</button><button class="btn dangerghost sm" onclick="impAll(\''+b.id+'\',\'rejected\')">'+t.impRejectAll+'</button><button class="btn primary sm" onclick="impApply(\''+b.id+'\')">'+t.impApply+'</button>';
  else h+='<span class="b-ok" style="color:var(--green)">✓ '+t.impDone+'</span>';
  h+='<button class="btn sm" onclick="impDiscard(\''+b.id+'\')">'+t.impDiscard+'</button></div>';
  const wr=A(b.warnings);if(wr.length)h+='<div class="note" style="padding:6px 14px">⚠ '+t.impWarn+' '+esc(wr.join(' · '))+'</div>';
  if(!done){
    const p=b.projId?PROJBY[b.projId]:null;
    h+='<datalist id="dlMk_'+b.id+'">'+(p?projMarcos(p).filter(g=>g.id!==SEM_ID).map(g=>'<option value="'+escA(g.nome)+'">').join(''):'')+'</datalist>';
    const gs=[],gi={};
    ch.forEach(c=>{const k=(c.type==='new-project'||c.type==='new-marco')?'__p':(c.type==='new-act'?c.cid:(c.type==='missing'?'__m':c.itemId));
      if(!gi[k]){gi[k]={k:k,items:[]};gs.push(gi[k]);}gi[k].items.push(c);});
    h+='<table class="impt"><thead><tr><th>'+t.impCol+'</th><th>'+t.impCur+'</th><th>'+t.impProp+'</th><th></th></tr></thead><tbody>';
    gs.forEach(g=>{
      if(g.k!=='__p'&&g.k!=='__m'&&g.items[0].type!=='new-act'){const a=ACTBY[g.k];h+='<tr class="imph2"><td colspan="4">'+esc(a?actAtiv(a):(g.items[0].ativ||g.k))+'</td></tr>';}
      h+=impRows(b,g.k,g.items);});
    h+='</tbody></table>';}
  return h+'</div>';}
function impSection(){const L=impBatchesLive();
  let h='<div class="sec"><header style="--c:var(--blue)"><span class="dot" style="--c:var(--blue)"></span><h2>'+t.impTitle+'</h2><span class="n">'+impPendingN()+'</span></header><div style="padding:14px">'
    +'<div class="projtools">'+impBtnHtml()+'</div>';
  h+=L.length?L.map(impBatchHtml).join(''):'<div class="note">'+t.impEmpty+'</div>';
  return h+'</div></div>';}
function impRefresh(b){const el=document.getElementById('ib_'+b.id);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=impBatchHtml(b);el.replaceWith(tmp.firstChild);}
  renderKpis();renderTabs();}
function impChange(b,cid){return A(b.changes).find(c=>c.cid===cid)||null;}
/* aprovar uma alteração que depende de projeto/marco novo aprova junto o projeto/marco (pendente) */
function impApproveDeps(b,c){const ch=A(b.changes);
  if(c.type!=='new-project'){const np=ch.find(x=>x.type==='new-project'&&x.state==='pending');if(np)np.state='approved';}
  if(c.marcoNome&&c.type!=='new-marco'){const nm=ch.find(x=>x.type==='new-marco'&&nk(x.marcoNome)===nk(c.marcoNome)&&x.state==='pending');if(nm)nm.state='approved';}}
function impSet(bid,cid,st){const b=impBatch(bid),c=b&&impChange(b,cid);if(!c||c.state==='applied')return;
  c.state=(c.state===st)?'pending':st;if(c.state==='approved')impApproveDeps(b,c);impTouch(b);impRefresh(b);}
function impAll(bid,st){const b=impBatch(bid);if(!b)return;
  A(b.changes).forEach(c=>{if(c.type==='missing'||c.state==='applied')return;c.state=st;});impTouch(b);impRefresh(b);}
function impEdit(bid,cid,f,el){const b=impBatch(bid),c=b&&impChange(b,cid);if(!c||c.state==='applied')return;
  const k=impKind(f);let v=el.value;
  if(k==='date')v=v||null;
  else if(k==='pct'){const n=parseFloat(String(v).replace(',','.'));v=isNaN(n)?null:Math.max(0,Math.min(1,n/100));}
  else if(k==='status')v=v||null;
  else v=String(v).trim();
  if(c.type==='new-act'){if(f==='marco')c.marcoNome=v;else c.new[f]=v;}
  else if(c.type==='new-project')c.new[f]=v;
  else{c.new=v;if(c.type==='edit'&&c.field==='marco')c.marcoNome=v;}
  c.state='approved';impApproveDeps(b,c);impTouch(b);impRefresh(b);}
function impApply(bid){const b=impBatch(bid);if(!b)return;const n=A(b.changes).filter(c=>c.state==='approved').length;
  if(!n){toast(t.impNoneAppr);return;}if(!confirm(t.impConfirm.replace('{n}',n)))return;applyImportBatch(bid);}
function impDiscard(bid){const b=impBatch(bid);if(!b)return;if(!confirm(t.impDiscConfirm))return;
  b.deleted=true;impTouch(b);refreshAll();saveOverlay();}
/* aplica as alterações APROVADAS: new-project → new-marco → new-act → edit → comment */
function applyImportBatch(bid){const b=impBatch(bid);if(!b)return null;
  const ap=A(b.changes).filter(c=>c.state==='approved');const res={applied:0,skipped:0,projId:b.projId||null};
  const touched=new Set(),file=b.file||'Importação Excel';
  let pid=b.projId||null,p=pid?PROJBY[pid]:null;
  const skip=c=>{c.state='rejected';res.skipped++;};
  const np=ap.find(c=>c.type==='new-project');
  if(np){const v=np.new||{};
    const pdef={id:newId('NPJ'),kind:'projdef',nome:v.nome||b.projNome||'(novo projeto)',resp:v.resp||'',plat:v.plat||'CORP',descricao:v.descricao||'',inicio:null,fim:null,createdBy:USER,createdTs:nowStamp()};
    DATA.overlay.newItems=A(DATA.overlay.newItems);DATA.overlay.newItems.push(pdef);sessionNewIds.add(pdef.id);
    p=projFromDef(pdef);addProjData(p);pid=pdef.id;b.projId=pid;touched.add(pid);np.state='applied';res.applied++;res.projId=pid;}
  ap.filter(c=>c.type==='new-marco').forEach(c=>{const nm=String(c.new||c.marcoNome||'').trim();
    if(!p||!nm){skip(c);return;}
    if(projMarcos(p).some(g=>g.explicit&&nk(g.nome)===nk(nm))){c.state='applied';return;}
    const arr=marcosArr(pid);const mx=arr.reduce((s,m)=>Math.max(s,+m.ordem||0),0);
    arr.push({id:impId('MK'),nome:nm,ordem:mx+1,deleted:false});touched.add(pid);c.state='applied';res.applied++;});
  ap.filter(c=>c.type==='new-act').forEach(c=>{const v=c.new||{};if(!p||!v.ativ){skip(c);return;}
    const mv=impMarcoVal(p,c.marcoNome);let marcoId=null,fase='';
    if(mv&&mv.indexOf('fase:')===0)fase=mv.slice(5);else if(mv){const g=projMarcos(p).find(x=>x.id===mv);if(g){marcoId=g.id;fase=g.nome;}}
    const ni={id:impId('NP'),kind:'projeto',projId:pid,projeto:projNome(p),num:nextProjNum(pid),fase:fase,marcoId:marcoId,ativ:v.ativ,resp:v.resp||projResp(p)||'',
      inicio:v.inicio||null,fim:v.fim||null,pct:v.pct==null?0:Math.max(0,Math.min(1,v.pct)),marco:'',prio:'',createdBy:'Importação Excel',createdTs:nowStamp()};
    DATA.overlay.newItems=A(DATA.overlay.newItems);DATA.overlay.newItems.push(ni);sessionNewIds.add(ni.id);
    const it=ovItem(ni.id);if(v.status==='Concluído'||v.status==='Cancelado')it.official.status=v.status;
    if(v.comment)it.comments.push({ts:nowStamp(),by:file,text:v.comment});
    const a=actFromNew(ni);a.comments=it.comments.slice();a.nComments=a.comments.length;linkAct(p,a);
    touched.add(ni.id);touched.add(pid);c.state='applied';res.applied++;});
  ap.filter(c=>c.type==='edit').forEach(c=>{const a=ACTBY[c.itemId];if(!a){skip(c);return;}
    const it=ovItem(a.id),v=c.new,o=it.official;
    switch(c.field){
      case 'ativ':if(v)o.ativ=(v!==a.ativ)?v:null;break;
      case 'resp':if(v)o.resp=(v!==a.resp)?v:null;break;
      case 'inicio':if(v)o.inicio=(v!==(a.baseInicio||''))?v:null;break;   /* C1: base, não o efetivo */
      case 'limite':if(v){const cur=o.limite||a.baseFim||a.fim||'';
        if(v!==cur)it.dateHistory.push({date:v,ts:nowStamp(),by:t.adminAuthor,note:'Importado de '+file});o.limite=(v!==(a.baseFim||''))?v:null;}break;
      case 'pct':if(v!=null)o.pct=Math.max(0,Math.min(1,+v));break;
      case 'status':o.status=v||null;break;
      case 'marco':{const pa=PROJOF[a.id];applyActMarco(a,it,impMarcoVal(pa,c.marcoNome!=null?c.marcoNome:v));break;}
    }
    touched.add(a.id);c.state='applied';res.applied++;});
  ap.filter(c=>c.type==='comment').forEach(c=>{const a=ACTBY[c.itemId];if(!a||!c.new){skip(c);return;}
    const it=ovItem(a.id);it.comments.push({ts:nowStamp(),by:c.by||file,text:c.new});a.comments=it.comments.slice();a.nComments=a.comments.length;
    touched.add(a.id);c.state='applied';res.applied++;});
  if(!A(b.changes).some(c=>c.state==='pending'||c.state==='approved'))b.state='done';
  touched.forEach(id=>markDirty(id));if(pid)openProj.add(pid);impTouch(b);
  refreshAll();saveOverlay();
  toast('✔ '+res.applied+' '+t.impApplied+(res.skipped?' · '+res.skipped+' ✕':''));
  return res;}

/* ---------- init ---------- */
function init(){
  let th='dark';try{th=localStorage.getItem('rm_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}catch(e){}
  applyTheme(th);
  document.getElementById('subtitle').textContent=(MODE==='view')?((DATA.consolidado?t.consolTitle:t.viewSub)+' — '+USER):t.sub;
  document.title=(MODE==='view'?'Meu Painel — '+USER:'RM Control Tower — Admin');
  const flag=(MODE==='admin')?'<span class="modeflag flag-admin">ADMIN · '+esc(USER)+'</span>':'<span class="modeflag flag-view">'+esc(USER)+(LANG==='es'?' · vista':' · visão')+'</span>';
  document.getElementById('meta').innerHTML=flag+'<br>'+(LANG==='es'?'Planilla-semente':'Planilha-semente')+': '+esc(DATA.fonte)+'<br>'+(LANG==='es'?'Generado':'Gerado')+': <b>'+esc(DATA.gerado)+'</b>';
  document.getElementById('helpzone').innerHTML='<div class="helpbox">'+((MODE==='admin')?t.helpAdmin:t.helpView)+'</div>';
  document.getElementById('footer').textContent='Sistema de Mapeo · Revenue Management LatAm';
  document.getElementById('lblPlat').textContent=t.plat;
  document.getElementById('fBusca').placeholder='🔍 '+t.busca;
  const resps=[...new Set(A(DATA.entregaveis).map(e=>entCurto(e)))].sort();
  document.getElementById('fResp').innerHTML='<option value="">'+t.resp+'</option>'+resps.map(r=>'<option>'+esc(r)+'</option>').join('');
  document.getElementById('fStatus').innerHTML='<option value="">'+t.status+'</option>'+['Atrasado','Hoje','Pendente','Sem prazo','Concluído','Cancelado'].map(s=>'<option value="'+s+'">'+stTxt(s)+'</option>').join('');
  const meses=[...new Set(A(DATA.entregaveis).map(e=>e.mes).filter(Boolean))];
  document.getElementById('fMes').innerHTML='<option value="">'+t.mes+'</option>'+meses.map(m=>'<option>'+esc(m)+'</option>').join('');
  document.getElementById('fResp').onchange=e=>{state.resp=e.target.value;renderContent();};
  document.getElementById('fStatus').onchange=e=>{state.status=e.target.value;state.quick='';renderContent();};
  document.getElementById('clearFilters').textContent=(LANG==='es'?'✕ Quitar filtros':'✕ Eliminar filtros');
  document.getElementById('fMes').onchange=e=>{state.mes=e.target.value;renderContent();};
  document.getElementById('fBusca').oninput=e=>{state.busca=e.target.value;renderContent();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  renderKpis();renderTabs();renderChips();renderContent();renderOutbar();
  if(MODE==='admin'&&fbCfg())loadOnlineSuggestions();
  if(aoOn())aoStart();
}
injectNewItems();
init();
if(MODE==='admin')syncFromDisk(false);
</script>
