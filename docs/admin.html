<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM Control Tower — Admin online</title>
<style>
  :root{--bg:#0c1220;--panel:#131c2e;--panel2:#182338;--line:#24314c;--tx:#dbe4f2;--tx2:#8fa0bc;--tx3:#5f6f8d;--blue:#4da3ff;--green:#3fb56a;--red:#e05555;--amber:#e0a640}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
  .top{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(90deg,#101a2c,#0d1526);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6fd0,#4da3ff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .top h1{font-size:15px;margin:0}.top .sub{font-size:11px;color:var(--tx2)}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:9px;padding:10px 16px;font:600 14px "Segoe UI",Arial;cursor:pointer}
  .btn.green{background:#1e7a48;border-color:#1e7a48;color:#fff}.btn.red{background:transparent;border-color:#7a2f36;color:#e88}
  .btn.blue{background:#2f6fd0;border-color:#2f6fd0;color:#fff;width:100%;padding:13px}
  .btn.sm{padding:7px 12px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card .who{font-size:12px;color:var(--tx3);margin-bottom:8px}
  .card .item{font-weight:700;font-size:16px;margin-bottom:10px}
  .card .row{font-size:14px;padding:3px 0;color:var(--tx)}
  .card .row b{color:var(--blue)}
  .card .cmt{background:var(--panel2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;color:var(--tx2)}
  .card .acts{display:flex;gap:10px;margin-top:14px}
  .card .acts .btn{flex:1}
  label{display:block;font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:12px;font-size:15px;outline:none}
  input:focus{border-color:var(--blue)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;margin:40px auto}
  .box h2{margin:0 0 4px;font-size:18px}.box p{color:var(--tx2);font-size:13px;margin:0 0 8px}
  .msg{font-size:13px;margin-top:10px;min-height:18px}
  .msg.err{color:var(--red)}.msg.ok{color:var(--green)}
  .muted{color:var(--tx3)}.empty{color:var(--tx3);text-align:center;padding:30px 10px}
  .hint{font-size:12px;color:var(--tx3);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><div class="logo">RM</div><div><h1>RM LATAM · Control Tower</h1><div class="sub">Admin online — aprovar sugestões</div></div>
  <div class="right"><span id="whoami" class="sub"></span><button class="btn sm" id="logoutBtn" style="display:none" onclick="doLogout()">Sair</button></div></div>
<div class="wrap">
  <div id="loginView" class="box" style="display:none">
    <h2>Entrar</h2><p>Acesso restrito (Jonathan / João).</p>
    <label>E-mail</label><input type="email" id="email" autocomplete="username">
    <label>Senha</label><input type="password" id="pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="margin-top:16px"><button class="btn blue" onclick="doLogin()">Entrar</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>
  <div id="appView" style="display:none">
    <div class="hint">Aprove ou rejeite as sugestões abaixo de qualquer lugar. O que você aprovar vira oficial quando o seu PC gerar/publicar o painel.</div>
    <div id="pendHead" style="font-weight:700;margin-bottom:10px"></div>
    <div id="pendBox"><div class="empty"><span class="spin"></span> carregando…</div></div>
  </div>
  <div id="bootMsg" class="empty"><span class="spin"></span> iniciando…</div>
</div>

const ADMINS = ["jonathan.braga@emergentcold.com","joao.silveira@emergentcold.com"];
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtY(iso){if(!iso)return '—';const p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function fbTs(ts){try{if(ts&&ts.toDate){const d=ts.toDate();const z=n=>('0'+n).slice(-2);return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes());}}catch(e){}return '';}
function show(id,on){document.getElementById(id).style.display=on?'':'none';}
let db,auth;
try{ firebase.initializeApp(FBCONFIG); auth=firebase.auth(); db=firebase.firestore(); }
catch(e){ document.getElementById('bootMsg').textContent='Erro ao iniciar o Firebase: '+e.message; }
if(auth){
  auth.onAuthStateChanged(u=>{
    show('bootMsg',false);
    if(u && ADMINS.indexOf((u.email||'').toLowerCase())>=0){
      show('loginView',false);show('appView',true);
      document.getElementById('whoami').textContent=u.email;
      document.getElementById('logoutBtn').style.display='';
      loadPending();
    } else if(u){
      auth.signOut(); show('appView',false); show('loginView',true);
      document.getElementById('logoutBtn').style.display='none';
      document.getElementById('loginMsg').className='msg err';
      document.getElementById('loginMsg').textContent='Este e-mail não tem permissão de aprovação.';
    } else {
      show('appView',false); show('loginView',true);
      document.getElementById('logoutBtn').style.display='none';
      document.getElementById('whoami').textContent='';
    }
  });
}
function doLogin(){
  const email=(document.getElementById('email').value||'').trim();
  const pass=document.getElementById('pass').value||'';
  const m=document.getElementById('loginMsg');m.className='msg';m.textContent='Entrando…';
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{m.className='msg err';
    m.textContent=(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found')?'E-mail ou senha incorretos.':('Erro: '+e.message);});
}
function doLogout(){auth.signOut();}
async function loadPending(){
  const box=document.getElementById('pendBox');box.innerHTML='<div class="empty"><span class="spin"></span> carregando…</div>';
  try{
    const [sSnap,dSnap]=await Promise.all([db.collection('suggestions').get(),db.collection('decisions').get()]);
    const decided={}; dSnap.forEach(d=>{const x=d.data();if(x.suggestionId)decided[x.suggestionId]=x.action;});
    const pend=[]; sSnap.forEach(d=>{ if(!decided[d.id]){const x=d.data();x._id=d.id;pend.push(x);} });
    pend.sort((a,b)=>((a.ts&&a.ts.toMillis?a.ts.toMillis():0)-(b.ts&&b.ts.toMillis?b.ts.toMillis():0)));
    document.getElementById('pendHead').textContent=pend.length? (pend.length+' sugestão(ões) pendente(s)') : '';
    if(!pend.length){box.innerHTML='<div class="empty">✅ Nenhuma sugestão pendente.</div>';return;}
    box.innerHTML=pend.map(cardHtml).join('');
  }catch(e){box.innerHTML='<div class="empty" style="color:var(--amber)">Erro ao carregar: '+esc(e.message)+'</div>';}
}
function cardHtml(s){const nome=LABELS[s.itemId]||s.itemId;
  let h='<div class="card" id="c_'+esc(s._id)+'"><div class="who">👤 '+esc(s.from||'?')+' · '+esc(fbTs(s.ts))+'</div>';
  h+='<div class="item">'+esc(nome)+'</div>';
  if(s.propDate)h+='<div class="row">📅 Nova data: <b>'+fmtY(s.propDate)+'</b></div>';
  if(s.propStatus)h+='<div class="row">🏷️ Status: <b>'+esc(s.propStatus)+'</b></div>';
  if(s.propPct!=null&&s.propPct!=='')h+='<div class="row">📊 % conclusão: <b>'+Math.round(parseFloat(s.propPct)*100)+'%</b></div>';
  if(s.comment)h+='<div class="cmt">💬 '+esc(s.comment)+'</div>';
  h+='<div class="acts"><button class="btn green" onclick="decide(\''+esc(s._id)+'\',\'approved\')">✔ Aprovar</button>'
    +'<button class="btn red" onclick="decide(\''+esc(s._id)+'\',\'rejected\')">✕ Rejeitar</button></div></div>';
  return h;}
async function decide(suggestionId,action){
  const card=document.getElementById('c_'+suggestionId); if(card)card.style.opacity='.5';
  try{
    await db.collection('decisions').add({suggestionId:suggestionId,action:action,by:(auth.currentUser.email||''),ts:firebase.firestore.FieldValue.serverTimestamp()});
    if(card)card.remove();
    const box=document.getElementById('pendBox');
    if(!box.querySelector('.card')){box.innerHTML='<div class="empty">✅ Tudo tratado. Obrigado!</div>';document.getElementById('pendHead').textContent='';}
  }catch(e){ if(card)card.style.opacity='1'; alert('Não foi possível registrar: '+e.message); }
}
